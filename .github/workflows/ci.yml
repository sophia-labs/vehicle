# CI for sophia-labs/vehicle, the one canonical repository for Vehicle.
# Runs the same two gates CONTRIBUTING.md asks for locally. No secrets.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: cargo test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      # Tests that need a real gardend (VEHICLE_TEST_GARDEND) report SKIPPED when it is not set.
      - run: cargo test --locked

  ts:
    name: ts packages (typecheck, test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ts/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19"
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml
      # vehicle-host's tests make real bwrap boxes. The Ubuntu 24.04 runner ships
      # without bubblewrap, and AppArmor lets a program make user namespaces only
      # when its profile says so: this grants that to /usr/bin/bwrap alone.
      - name: Install bubblewrap
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile bwrap /usr/bin/bwrap flags=(unconfined) {\n  userns,\n}\n' | sudo tee /etc/apparmor.d/bwrap >/dev/null
          sudo apparmor_parser -r /etc/apparmor.d/bwrap
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
