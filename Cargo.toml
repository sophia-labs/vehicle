[package]
name = "vehicle"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
cockpit = "0.2.2"
crossterm = "0.28"
futures-util = "0.3"
ratatui = "0.29"
ratatui-core = "0.1"
ratatui-crossterm = { version = "0.1", default-features = false, features = ["crossterm_0_28"] }
ratatui-textarea = { version = "0.9.2", default-features = false }
ratatui-widgets = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signal-hook = "0.3"
tempfile = "3.12"
thiserror = "2.0"
tokio = { version = "1.48", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "time"] }
tokio-tungstenite = { version = "0.28", features = ["native-tls"] }
unicode-width = "0.2"
yrs = "0.27.0"

[dev-dependencies]
portable-pty = "0.8"
vt100 = "0.15"
